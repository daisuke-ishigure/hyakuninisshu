<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 698 583" width="698" height="583">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6e3"/>
      <stop offset="100%" stop-color="#f0e6c8"/>
    </linearGradient>
    <linearGradient id="diceFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf6e6"/>
    </linearGradient>
  </defs>

  <rect width="698" height="583" fill="url(#bg)"/>

  <!-- decorative faint circles -->
  <circle cx="60" cy="60" r="90" fill="#7EA549" opacity="0.08"/>
  <circle cx="650" cy="500" r="130" fill="#B82343" opacity="0.07"/>

  <!-- title -->
  <text x="349" y="118" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho','MS Mincho',serif" font-size="30" fill="#8a6d1a" letter-spacing="4">百人一首</text>
  <text x="349" y="182" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho','MS Mincho',serif" font-weight="700" font-size="58" fill="#B82343" letter-spacing="2">宝集め双六</text>
  <rect x="229" y="204" width="240" height="6" rx="3" fill="#B82343"/>

  <!-- dice -->
  <g transform="translate(299,230)">
    <rect x="0" y="0" width="100" height="100" rx="18" fill="url(#diceFace)" stroke="#333" stroke-width="5"/>
    <circle cx="26" cy="26" r="9" fill="#B82343"/>
    <circle cx="50" cy="50" r="9" fill="#B82343"/>
    <circle cx="74" cy="74" r="9" fill="#B82343"/>
    <circle cx="74" cy="26" r="9" fill="#B82343"/>
    <circle cx="26" cy="74" r="9" fill="#B82343"/>
  </g>

  <!-- sparkle accents -->
  <g fill="#e6c34c">
    <path d="M232 250 l7 16 16 7 -16 7 -7 16 -7 -16 -16 -7 16 -7 z"/>
    <path d="M466 300 l6 13 13 6 -13 6 -6 13 -6 -13 -13 -6 13 -6 z"/>
  </g>

  <!-- board squares row -->
  <g font-family="'Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="30" text-anchor="middle">
    <g transform="translate(139,400)">
      <rect width="80" height="80" rx="14" fill="#fff6da" stroke="#e6c34c" stroke-width="4"/>
      <text x="40" y="52">⏳</text>
    </g>
    <g transform="translate(229,400)">
      <rect width="80" height="80" rx="14" fill="#eaf2ff" stroke="#7c9fe0" stroke-width="4"/>
      <text x="40" y="52">❓</text>
    </g>
    <g transform="translate(319,400)">
      <rect width="80" height="80" rx="14" fill="#fff0f6" stroke="#e07a9b" stroke-width="4"/>
      <text x="40" y="52">✨</text>
    </g>
    <g transform="translate(409,400)">
      <rect width="80" height="80" rx="14" fill="#fff6da" stroke="#e6c34c" stroke-width="4"/>
      <text x="40" y="52">📖</text>
    </g>
    <g transform="translate(499,400)">
      <rect width="80" height="80" rx="14" fill="linear-gradient(#ffe9c2,#ffd08a)" style="fill:#ffe0ad" stroke="#e0a63e" stroke-width="4"/>
      <text x="40" y="52">⛰️</text>
    </g>
  </g>

  <text x="349" y="540" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="22" fill="#5a4a2a">7つの宝を集めてタイムアタック！</text>
</svg>
