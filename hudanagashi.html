      <h1 id="page-title">百人一首の<br class="br-sp">決まり字を覚える<br class="br-sp">札流し練習</h1>

      <p id="page-desc" style="font-size:0.9rem;color:#666;margin-bottom:0.5em;">
        札流しは、下の句の札を見て上の句の決まり字を瞬時に思い出す、

        決まり字の反応速度を高めることで、札を取るスピードと精度が向上します。<br>

  <script>
    (async () => {
      'use strict';

      // ── データ読み込み ──
      let poems = [];
      try {
        const res = await fetch('../js/hyakunin.json?04');
        const data = await res.json();
        poems = Object.values(data);
      } catch {
        document.getElementById('load-error').style.display = '';
        document.getElementById('startBtn').disabled = true;
        return;
      }

      // ── 状態 ──
      let selectedColor = '全部';
      let selectedKimariji = 0;
      let displayMs = 500;
      let batchSize = 5;
      let batches = [];
      let batchIndex = 0;
      let currentBatch = [];

      // ── 一時停止 ──
      let _isPaused = false;
      let _resumeCallbacks = [];
      let _cancelCurrentDelay = null;

      function waitForResume() {
        return new Promise(resolve => _resumeCallbacks.push(resolve));
      }
      function triggerResume() {
        const cbs = _resumeCallbacks.splice(0);
        cbs.forEach(cb => cb());
      }
      function pauseableDelay(ms) {
        return new Promise(resolve => {
          let remaining = ms;
          (async function loop() {
            while (remaining > 0) {
              if (_isPaused) { await waitForResume(); continue; }
              const started = Date.now();
              await new Promise(r => {
                const id = setTimeout(() => { _cancelCurrentDelay = null; r(); }, remaining);
                _cancelCurrentDelay = () => {
                  clearTimeout(id);
                  remaining -= Date.now() - started;
                  _cancelCurrentDelay = null;
                  r();
                };
              });
              if (!_isPaused) remaining = 0;
            }
            resolve();
          })();
        });
      }

      document.getElementById('pause-btn').addEventListener('click', () => {
        _isPaused = !_isPaused;
        const btn = document.getElementById('pause-btn');
        if (_isPaused) {
          if (_cancelCurrentDelay) _cancelCurrentDelay();
          btn.innerHTML = '<img src="../img/play.svg" alt="再生" class="pause-icon">';
          btn.title = '再生';
          btn.classList.add('paused');
        } else {
          btn.innerHTML = '<img src="../img/pause.svg" alt="一時停止" class="pause-icon">';
          btn.title = '一時停止';
          btn.classList.remove('paused');
          triggerResume();
        }
      });

      // ── 連続枚数 ──
      document.getElementById('batch-select').addEventListener('change', e => {
        batchSize = parseInt(e.target.value, 10);
      });

      // ── 表示時間 ──
      document.getElementById('speed-select').addEventListener('change', e => {
        displayMs = parseInt(e.target.value, 10);
      });

      // ── 決まり字絞り込み ──
      document.getElementById('kimariji-select').addEventListener('change', e => {
        selectedKimariji = parseInt(e.target.value, 10);
      });

      // ── 色ボタン ──
      document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedColor = btn.dataset.color;
        });
      });

      // ── スタート ──
      document.getElementById('startBtn').addEventListener('click', () => {
        startGame(selectedColor);
      });

      function startGame(color) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        hide('page-title');
        hide('page-desc');
        hide('site-header');
        hide('site-footer');
        let pool = color === '全部' ? [...poems] : poems.filter(p => p.color === color);
        if (selectedKimariji > 0) pool = pool.filter(p => p.kimariji.length === selectedKimariji);
        pool = shuffle(pool);
        batches = [];
        for (let i = 0; i < pool.length; i += batchSize) batches.push(pool.slice(i, i + batchSize));
        batchIndex = 0;
        hide('setup-panel');
        runBatch();
      }

      // ── バッチ実行 ──
      async function runBatch() {
        // 一時停止状態をリセット
        _isPaused = false;
        _resumeCallbacks = [];
        _cancelCurrentDelay = null;
        const btn = document.getElementById('pause-btn');
        btn.innerHTML = '<img src="../img/pause.svg" alt="一時停止" class="pause-icon">';
        btn.title = '一時停止';
        btn.classList.remove('paused');

        currentBatch = batches[batchIndex];

        // 進捗表示
        const total = batches.reduce((s, b) => s + b.length, 0);
        const done = batches.slice(0, batchIndex).reduce((s, b) => s + b.length, 0);
        document.getElementById('progress-text').textContent =
          `${done + 1}〜${done + currentBatch.length}枚目 ／ 全${total}枚`;

        document.querySelector('.fuda-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
        show('flash-panel');
        hide('answer-panel');

        // 枚数分フラッシュ
        for (let i = 0; i < currentBatch.length; i++) {
          document.getElementById('card-counter').textContent = `${i + 1} ／ ${currentBatch.length}`;
          await flashCard(currentBatch[i]);
        }

        document.getElementById('card-counter').textContent = '';
        hide('flash-panel');

        // 自動で答え合わせ表示
        const nums = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩'];
        document.getElementById('answer-list').innerHTML = currentBatch.map((p, i) =>
          `<div class="answer-item">
            <span class="answer-num">${nums[i]}</span>
            <span class="answer-kami">${buildKamiHtml(p)}</span>
          </div>`
        ).join('');
        const isLast = batchIndex >= batches.length - 1;
        document.getElementById('finish-msg').hidden = !isLast;
        show('answer-panel');
      }

      // ── 1枚フラッシュ ──
      async function flashCard(poem) {
        const cardEl = document.getElementById('flash-card');
        const textEl = document.getElementById('flash-card-text');
        textEl.innerHTML = poem.torihuda;
        const fadeMs = Math.min(Math.round(displayMs * 0.15), 100);

        cardEl.style.transition = 'none';
        cardEl.style.opacity = '1';

        await pauseableDelay(displayMs);

        cardEl.style.transition = `opacity ${fadeMs / 1000}s ease`;
        cardEl.style.opacity = '0';
        await new Promise(r => setTimeout(r, fadeMs + 100));
      }

      // ── 上の句HTML生成（決まり字を赤くする） ──
      function buildKamiHtml(poem) {
        // yomihuda を <br> で分割して上の句3句を取得
        const phrases = poem.yomihuda.split('<br>').slice(0, 3);
        let remaining = poem.kimariji.length;
        return phrases.map(phrase => {
          if (remaining <= 0) return phrase;
          const red = phrase.slice(0, remaining);
          const rest = phrase.slice(remaining);
          remaining -= red.length;
          return `<span class="answer-kj-red">${red}</span>${rest}`;
        }).join(' ');
      }

      // ── 次へ（次のバッチ、最後ならシャッフルして最初から） ──
      document.getElementById('restart-btn').addEventListener('click', () => {
        if (batchIndex >= batches.length - 1) {
          startGame(selectedColor);
        } else {
          batchIndex++;
          runBatch();
        }
      });

      // ── 反復（同じバッチをもう一度） ──
      document.getElementById('repeat-btn').addEventListener('click', () => {
        runBatch();
      });

      // ── 設定に戻る ──
      document.getElementById('back-to-setup-btn').addEventListener('click', () => {
        hide('flash-panel');
        hide('answer-panel');
        show('setup-panel');
        show('page-title');
        show('page-desc');
        show('site-header');
        show('site-footer');
      });

      // ── ユーティリティ ──
      function show(id) { document.getElementById(id).hidden = false; }
      function hide(id) { document.getElementById(id).hidden = true; }

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
    })();
  </script>
