      font-family: "Kaisei HarunoUmi", serif;

      overflow-x: hidden;
    }

    /* ルビの調整を追加 */
    ruby {
      ruby-align: center;
    }

    rt {
      margin-left: -0.1em;
      line-height: 1;
      font-size: 0.4em;
    }

    @media(max-width:1000px) {
      rt {
        margin-left: -0.2em;
      }
    }

    main {
      padding: 5px;
      display: block;
    }

    /* フィルターボタン用のスタイル */
    .filter-controls {
      text-align: center;
      margin: 30px auto;
      max-width: 1200px;
    }

    .filter-controls button {
      font-family: "noto-sans-pro", sans-serif !important;
      margin: 5px;
      padding: 10px 20px;
      font-size: 1rem;
      border: 2px solid #8a9a78;
      background: #fff;
      color: #333;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .filter-controls button:hover {
      color: #222;
    }

    .filter-controls button.mixitup-control-active {
      color: #222;
      border-color: #B82343 !important;
    }

    #container {
      display: flex;
      flex-wrap: wrap;
      flex-direction: row-reverse;
      justify-content: center;
      row-gap: 40px;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
    }

    /* --- カード（札）の設定 --- */
    .card {
      margin: 0 15px;
      width: 320px;
      height: 420px;
      background: #fff url(../img/paper.gif);
      padding: 30px 15px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 15px solid #8a9a78;
      writing-mode: vertical-rl;
      text-orientation: upright;
      position: relative;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      line-height: 1.7;
      /* 統一された行間を追加 */
    }

    /* --- 上の句（隠す対象） --- */
    .kami {
      height: 80%;
      cursor: pointer;
      font-size: 1.6rem;
      margin-bottom: 20px;
      padding: 15px 0;
      line-height: 1.7;
      /* 1.8 → 2.5 に変更 */
      letter-spacing: 0.1em;
      border-radius: 5px;
      background: #ffe9e9;
      color: transparent;
      transition: background 0.6s ease;
      position: relative;
      min-height: 6em;
      z-index: 2;
      will-change: transform, opacity;
      justify-content: flex-end;
    }

    .kami rt {
      visibility: hidden;
    }

    .kami.revealed rt {
      visibility: visible;
    }


    /* めくられた時の文字演出 */
    .kami.revealed {
      background: transparent !important;
      color: #333 !important;
      animation: text-float-up 1.2s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    }

    @keyframes text-float-up {
      0% {
        opacity: 0;
        transform: translateY(15px);
        filter: blur(4px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    /* --- 下の句（最初から表示） --- */
    .shimo {
      font-size: 1.6rem;
      line-height: 1.7;
      padding: 15px 0;
      color: #444;
    }

    .author {
      position: absolute;
      z-index: 100;
      right: 15px;
      bottom: 30px;
      font-size: 1.1rem;
      color: #444;
    }

    /* --- 花びら演出 --- */
    .sparkle {
      position: absolute;
      width: 10px;
      height: 14px;
      border-radius: 50% 10% 50% 50%;
      pointer-events: none;
      z-index: 10;
      animation: flower-fall 3s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
      will-change: transform, opacity;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
    }

    @keyframes flower-fall {
      0% {
        transform: translate3d(0, 0, 0) scale(0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 1;
        transform: translate3d(0, 10px, 0) scale(1.2) rotate(45deg);
      }

      100% {
        transform: translate3d(var(--random-x), 280px, 0) scale(0.3) rotate(360deg);
        opacity: 0;
      }
    }

    /* --- リンクボタン --- */

      text-decoration: none;

      padding: 8px 5px;

<body>

  <main>
    <!-- フィルターボタン -->
    <div class="filter-controls">
      <button type="button" data-filter="all">すべて</button>
      <button type="button" data-filter=".ピンク"
        style="background-color: #ffd1dc; padding: 10px 20px; border-radius: 5px; cursor: pointer;">ピンク</button>
      <button type="button" data-filter=".青"
        style="background-color: #d1e9ff; padding: 10px 20px; border-radius: 5px; cursor: pointer;">青</button>
      <button type="button" data-filter=".黄"
        style="background-color: #fff9c4; padding: 10px 20px; border-radius: 5px; cursor: pointer;">黄</button>
      <button type="button" data-filter=".緑"
        style="background-color: #dcedc8; padding: 10px 20px; border-radius: 5px; cursor: pointer;">緑</button>
      <button type="button" data-filter=".橙"
        style="background-color: #ffe0b2; padding: 10px 20px; border-radius: 5px; cursor: pointer;">橙</button>
    </div>

    <div id="container"></div>

    <script>
      let mixer; // MixItUpインスタンスを格納

      async function loadHyakuninIsshu() {
        try {
          const response = await fetch('./js/hyakunin.json?04');
          const data = await response.json();
          const container = document.getElementById('container');

          Object.values(data).forEach(item => {
            const card = document.createElement('div');
            card.className = 'card mix ' + item.color; // colorの値をクラスに追加
            card.innerHTML = `
              <div class="author">${item.name}</div>
              <div class="kami" onclick="reveal(this)">${item.first}</div>
              <div class="shimo">${item.second}</div>
              <a href="${item.number}.html" class="detail-link">第${item.number}首<br>解説ページ</a>
            `;
            container.appendChild(card);
          });

          for (let i = 0; i < 4; i++) {
            const spacer = document.createElement('div');
            spacer.className = 'spacer';
            container.appendChild(spacer);
          }

          // MixItUpの初期化
          mixer = mixitup(container, {
            selectors: {
              target: '.card' // フィルタリング対象
            },
            animation: {
              duration: 400,
              effects: 'fade scale', // フェード＆スケールアニメーション
              easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)'
            }
          });

        } catch (e) { console.error(e); }
      }

      function reveal(el) {
        if (el.classList.contains('revealed')) return;
        el.classList.add('revealed');

        const w = el.offsetWidth;
        const h = el.offsetHeight;

        for (let i = 0; i < 20; i++) {
          setTimeout(() => {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = (Math.random() * w) + 'px';
            sparkle.style.top = (Math.random() * 20) + 'px';

            const randomX = (Math.random() - 0.5) * 200;
            sparkle.style.setProperty('--random-x', `${randomX}px`);

            const colors = [
              'rgba(255, 210, 225, 0.9)',
              'rgba(255, 235, 240, 0.9)',
              'rgba(255, 255, 255, 0.95)'
            ];
            sparkle.style.background = colors[Math.floor(Math.random() * colors.length)];

            const duration = 2 + Math.random() * 1.5;
            sparkle.style.animationDuration = `${duration}s`;

            el.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), duration * 1000);
          }, i * 30); // 発生を少しずつずらして滑らかに
        }
      }

      loadHyakuninIsshu();
    </script>
