        ['道因', '（82）道因法師', '道因:<br>（1090年～1182年頃）<br>俗名は藤原敦頼', new Date(1090, 0), new Date(1182, 11)],
        ['藤原俊成', '（83）皇太后宮大夫俊成', '藤原俊成:<br>（1114年-1204年）', new Date(1114, 0), new Date(1204, 11)],
        ['藤原清輔', '（84）藤原清輔朝臣', '藤原清輔:<br>（1104年-1177年）', new Date(1104, 0), new Date(1177, 11)],
        ['俊恵', '（85）俊恵法師', '俊恵:<br>（1113年～1191年頃）', new Date(1113, 0), new Date(1191, 11)],
        ['西行', '（86）西行法師', '西行:<br>（1118年-1190年）', new Date(1118, 0), new Date(1190, 11)],
        ['寂蓮', '（87）寂蓮法師', '寂蓮:<br>（1139年-1202年）', new Date(1139, 0), new Date(1202, 11)],
        ['皇嘉門院別当', '（88）皇嘉門院別当', '皇嘉門院別当:<br>（生没年不詳）<br>1175年の歌合に出詠、1182年には出家していた。最後の記録の20年前から表示', new Date(1162, 0), new Date(1182, 11)],
        ['式子内親王', '（89）式子内親王', '式子内親王:<br>（1149年-1201年）', new Date(1149, 0), new Date(1201, 11)],
        ['殷富門院大輔', '（90）殷富門院大輔', '殷富門院大輔:<br>（1130年頃-1200年頃）', new Date(1130, 0), new Date(1200, 11)],
        ['九条良経', '（91）後京極摂政前太政大臣', '九条良経:<br>（1169年-1206年）', new Date(1169, 0), new Date(1206, 11)],
        ['二条院讃岐', '（92）二条院讃岐', '二条院讃岐:<br>（1141年頃～1217年頃）<br>1216年の内裏歌合まで活動が確認できる', new Date(1141, 0), new Date(1217, 11)],
        ['源実朝', '（93）鎌倉右大臣', '源実朝:<br>（1192年-1219年）', new Date(1192, 0), new Date(1219, 11)],
        ['藤原雅経', '（94）参議雅経', '藤原雅経:<br>（1170年-1221年）', new Date(1170, 0), new Date(1221, 11)],
        ['慈円', '（95）前大僧正慈円', '慈円:<br>（1155年-1225年）', new Date(1155, 0), new Date(1225, 11)],
        ['西園寺公経', '（96）入道前太政大臣', '西園寺公経:<br>（1171年-1244年）', new Date(1171, 0), new Date(1244, 11)],
        ['藤原定家', '（97）権中納言定家', '藤原定家:<br>（1162年-1241年）', new Date(1162, 0), new Date(1241, 11)],
        ['藤原家隆', '（98）従二位家隆', '藤原家隆:<br>（1158年-1237年）', new Date(1158, 0), new Date(1237, 11)],
        ['後鳥羽天皇', '（99）後鳥羽院', '後鳥羽院:<br>（1180年-1239年）', new Date(1180, 0), new Date(1239, 11)],
        ['順徳院', '（100）順徳院', '順徳院:<br>（1197年-1242年）', new Date(1197, 0), new Date(1242, 11)],
      ]);



      // 表示フィルタ条件を決めるコントロール作成
      // 一番上の行：時代区分。誕生年のスライダーで絞り込んでも消さない
      // 平安時代の前期・中期・後期は、おおよその区切り（900年頃・1050年頃）で分ける
      // 飛鳥時代の始まりと鎌倉時代の終わりは、年表の左右に空白が広がらないよう、歌人のいる範囲（620～1250年）で切る（表記は本来の年）
      var ERAS = [
        ['飛鳥', '592年～710年', 620, 710],
        ['奈良', '710年～794年', 710, 794],
        ['平安前期', '794年～900年頃', 794, 900],
        ['平安中期', '900年～1050年頃', 900, 1050],
        ['平安後期', '1050年～1185年頃', 1050, 1185],
        ['鎌倉', '1185年／1192年～1333年', 1185, 1250]
      ];
      dataTable.insertRows(0, ERAS.map(function (e) {
        return ['時代区分', e[0], e[0] + ':<br>' + e[1], new Date(e[2], 0), new Date(e[3], 0)];
      }));
      var eraRows = ERAS.length;

      // 誕生年（整数）の列を足し、スライダーはこの列で絞り込む（時代区分の行は空のまま）。
      // 日付の列（Start）で絞り込むと、古い日付の時差の扱いで下限がわずかにずれて、最初の歌人（天智天皇・626年）が表示されなくなるため
      var yearCol = dataTable.addColumn({ type: 'number', id: 'BirthYear' });
      for (var i = eraRows; i < dataTable.getNumberOfRows(); i++) {
        dataTable.setValue(i, yearCol, dataTable.getValue(i, 3).getFullYear());
      }

      // バーの色：男性の歌人は青（#427aa1）、女性の歌人は赤（#b82343）、時代区分の行は濃いグレー（#333333）
      // 女性歌人は歌番号で判定（js/my-chart-women.js の10首ごとの人数と同じ21人）。歌番号の無い行（出来事など）は、同じ名前の歌人の色にする
      var FEMALE = [2, 9, 19, 38, 53, 54, 56, 57, 58, 59, 60, 61, 62, 65, 67, 72, 80, 88, 89, 90, 92];
      var numByName = {};
      for (var i = eraRows; i < dataTable.getNumberOfRows(); i++) {
        var m = String(dataTable.getValue(i, 1)).match(/^（(\d+)）/);
        if (m && !numByName[dataTable.getValue(i, 0)]) numByName[dataTable.getValue(i, 0)] = +m[1];
      }
      var styleCol = dataTable.addColumn({ type: 'string', role: 'style' });
      for (var i = 0; i < dataTable.getNumberOfRows(); i++) {
        if (i < eraRows) {
          dataTable.setValue(i, styleCol, '#333333');
          continue;
        }
        var female = FEMALE.indexOf(numByName[dataTable.getValue(i, 0)]) >= 0;
        dataTable.setValue(i, styleCol, female ? '#b82343' : '#427aa1');
      }

      var projectRange = new google.visualization.ControlWrapper({
        controlType: 'NumberRangeFilter',
        containerId: 'project_range',
        dataTable: dataTable,
        options: {
          filterColumnIndex: yearCol,         // 誕生年でフィルタ
          ui: {
            showRangeValues: true,          // 選択範囲のラベル表示
            format: { pattern: '0' },       // 表示フォーマット（年）
            unitIncrement: 1,
            blockIncrement: 10
          }
        }
      });

      // タイムラインチャート作成
      var projectTimechart = new google.visualization.ChartWrapper({
        'chartType': 'Timeline',
        'containerId': 'project_timechart',
        dataTable: dataTable,
        options: {
        timeline: { showRowLabels: false }, // 一番左の列を非表示
        hAxis: { format: 'y' },
        tooltip: { isHtml: true },
      }
      });

      // スライダーの範囲に誕生年が入る歌人と、時代区分の行だけを年表に渡して描く
      // （Dashboard で結びつけると、時代区分の行まで絞り込まれてしまうため、自分で絞り込む）
      function drawChart() {
        var st = projectRange.getState() || {};
        var rows = [];
        for (var r = 0; r < dataTable.getNumberOfRows(); r++) {
          var y = dataTable.getValue(r, yearCol);
          if (r < eraRows || ((st.lowValue == null || y >= st.lowValue) && (st.highValue == null || y <= st.highValue))) rows.push(r);
        }
        projectTimechart.setView({ columns: [0, 1, 2, styleCol, 3, 4], rows: rows }); // 色の列は Start の前に置く。誕生年の列は年表には渡さない
        projectTimechart.draw();
      }
      // 縦の区切り線：年表の目盛り（100年ごと）の線を消し、時代区分の境目（ERAS の各時代の始まり）に線を引く。
      // Timeline には線の位置を指定するオプションが無いので、描き終わった SVG を直接書き換える
      function drawEraLines() {
        var svgs = document.getElementById('project_timechart').querySelectorAll('svg');
        if (svgs.length < 2) return;
        // 目盛りの文字（700・800…）の位置から、年 → x 座標の対応を求める
        var ticks = Array.prototype.filter.call(svgs[0].querySelectorAll('text'), function (t) { return /^\d+$/.test(t.textContent); })
          .map(function (t) { return { year: +t.textContent, x: +t.getAttribute('x') }; });
        if (ticks.length < 2) return;
        var a = ticks[0];
        var b = ticks[ticks.length - 1];
        var perYear = (b.x - a.x) / (b.year - a.year);
        var xOf = function (year) { return a.x + (year - a.year) * perYear; };

        // 下の目盛りの年（700・800…）を、時代区分の境目の年（710・794…）に置き換える。文字の高さ・書式はもとの目盛りに合わせる
        var tickEls = Array.prototype.filter.call(svgs[0].querySelectorAll('text'), function (t) { return /^\d+$/.test(t.textContent); });
        var sample = tickEls[0];
        tickEls.forEach(function (t) { t.style.display = 'none'; });
        ERAS.slice(1).forEach(function (e) {
          var label = sample.cloneNode(false);
          label.style.display = '';
          label.setAttribute('x', xOf(e[2]));
          label.textContent = e[2];
          sample.parentNode.appendChild(label);
        });
        var rowsSvg = svgs[1];
        var grid = rowsSvg.children[1]; // 行の背景・罫線のグループ（バーより下に描かれる）
        if (!grid) return;
        // もとの縦の目盛り線（始点と終点の x が同じ線）を消す
        Array.prototype.forEach.call(grid.querySelectorAll('path'), function (p) {
          var m = (p.getAttribute('d') || '').match(/^M([\d.]+),[\d.]+L([\d.]+),[\d.]+$/);
          if (m && m[1] === m[2]) p.style.display = 'none';
        });
        var height = rowsSvg.getAttribute('height');
        ERAS.slice(1).forEach(function (e) {
          var x = xOf(e[2]);
          var line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          line.setAttribute('d', 'M' + x + ',0L' + x + ',' + height);
          line.setAttribute('stroke', '#cccccc'); // 薄いグレー（行の背景の白・グレーのどちらの上でも見える濃さ）
          line.setAttribute('stroke-width', '1');
          line.setAttribute('fill', 'none');
          grid.appendChild(line);
        });

        // 時代区分の帯どうしの境目に白い線を引く（帯が同じ色なので、隣の時代とつながって見えないように）。バーより上に描く
        var bars = rowsSvg.children[3];
        var eraBar = bars && Array.prototype.filter.call(bars.querySelectorAll('rect'), function (r) { return r.getAttribute('fill') === '#333333'; })[0];
        if (eraBar) {
          var y1 = +eraBar.getAttribute('y');
          var y2 = y1 + +eraBar.getAttribute('height');
          ERAS.slice(1).forEach(function (e) {
            var x = xOf(e[2]);
            var sep = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            sep.setAttribute('d', 'M' + x + ',' + y1 + 'L' + x + ',' + y2);
            sep.setAttribute('stroke', '#ffffff');
            sep.setAttribute('stroke-width', '1');
            sep.setAttribute('fill', 'none');
            bars.appendChild(sep);
          });

          // 時代区分の行を、スクロールしても年表の一番上に残す。
          // 行の部分だけがスクロールするので、そのスクロールする箱の外側（親の箱）の上端に、この行の複製を重ねる。
          // スクロールしていないときは、元の行にぴったり重なる
          var scroller = rowsSvg.parentNode;
          var holder = scroller && scroller.parentNode;
          var rowH = y1 + +eraBar.getAttribute('height') + y1; // 行の高さ（帯の上下に同じ余白）
          var line = grid.querySelector('path[stroke="#b7b7b7"]'); // 行の境目の横線
          var m2 = line && (line.getAttribute('d') || '').match(/^M[\d.]+,([\d.]+)L/);
          if (m2) rowH = +m2[1];
          if (holder) {
            var NS = 'http://www.w3.org/2000/svg';
            var sticky = document.createElement('div');
            sticky.className = 'era-sticky';
            sticky.style.cssText = 'position:absolute;top:' + scroller.offsetTop + 'px;left:' + scroller.offsetLeft + 'px;' +
              'width:' + scroller.clientWidth + 'px;height:' + rowH + 'px;overflow:hidden;z-index:1;';
            var svg = document.createElementNS(NS, 'svg');
            svg.setAttribute('width', rowsSvg.getAttribute('width'));
            svg.setAttribute('height', rowH);
            svg.style.display = 'block';
            var bg = document.createElementNS(NS, 'rect');
            bg.setAttribute('x', 0); bg.setAttribute('y', 0);
            bg.setAttribute('width', rowsSvg.getAttribute('width')); bg.setAttribute('height', rowH);
            bg.setAttribute('fill', '#ffffff');
            svg.appendChild(bg);
            // 時代区分の行（年表の最初の行）にある帯・名前・白の区切り線を複製する
            Array.prototype.forEach.call(bars.children, function (el) {
              var top = el.tagName === 'path'
                ? +((el.getAttribute('d') || '').match(/^M[\d.]+,([\d.]+)/) || [0, Infinity])[1]
                : +el.getAttribute('y');
              if (top < rowH) svg.appendChild(el.cloneNode(true));
            });
            // 年表は帯に収まらない名前を「平…」のように省略するので、固定表示の帯では省略せずに書き直す。
            // 帯に収まらないときは文字を小さくする（最小 8px）
            var eraRects = Array.prototype.filter.call(svg.querySelectorAll('rect'), function (r) { return r.getAttribute('fill') === '#333333'; })
              .sort(function (p, q) { return +p.getAttribute('x') - +q.getAttribute('x'); });
            var eraTexts = Array.prototype.slice.call(svg.querySelectorAll('text'))
              .sort(function (p, q) { return +p.getAttribute('x') - +q.getAttribute('x'); });
            eraRects.forEach(function (r, i) {
              var t = eraTexts[i];
              if (!t || !ERAS[i]) return;
              var name = ERAS[i][0];
              var size = +t.getAttribute('font-size') || 12;
              var room = +r.getAttribute('width') - 8;
              if (name.length * size > room) size = Math.max(8, Math.floor(room / name.length));
              t.textContent = name;
              t.setAttribute('font-size', size);
              t.setAttribute('x', +r.getAttribute('x') + 4);
            });
            var under = document.createElementNS(NS, 'path');
            under.setAttribute('d', 'M0,' + (rowH - 0.5) + 'L' + rowsSvg.getAttribute('width') + ',' + (rowH - 0.5));
            under.setAttribute('stroke', '#b7b7b7');
            svg.appendChild(under);
            sticky.appendChild(svg);
            holder.appendChild(sticky);
          }
        }
      }
      google.visualization.events.addListener(projectTimechart, 'ready', drawEraLines);

      google.visualization.events.addListener(projectRange, 'ready', drawChart);
      // 画面の大きさ・向きが変わったら描き直す（年表は描いたときの大きさのままになるため）
      var resizeTimer = 0;
      var lastSize = window.innerWidth + 'x' + window.innerHeight;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          var size = window.innerWidth + 'x' + window.innerHeight;
          if (size === lastSize) return;
          lastSize = size;
          drawChart();
        }, 200);
      });
      google.visualization.events.addListener(projectRange, 'statechange', drawChart);
      projectRange.draw();

      // 歌人をクリックすると、系図のページと同じツールチップを出す（js/chronology-tips.js）
      if (window.chronologyTips) window.chronologyTips(projectTimechart, dataTable);
    }





  </script>
