<!DOCTYPE html>
<html>
<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];

  <meta charset="UTF-8">
  <title>百人一首に登場する歌枕地図</title>
  <meta name="description" content="百人一首の歌に詠まれた「歌枕」（地名）を実際の地図上にマッピングして紹介。歌がどの土地を舞台にしているのか、位置関係で確認できます。">
  <link rel="canonical" href="https://hyakuninisshu.com/leaflet-map.html">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.0/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.3.0/dist/leaflet.js"></script>
  <script src="https://code.jquery.com/ui/1.8.24/jquery-ui.min.js"></script>
  <script src="js/leaflet.customsearchbox.min.js"></script>
  <link href="css/searchbox.min.css" rel="stylesheet" />
    <!-- favicon用 -->
    <link rel=”icon” href=“/favicon.ico”>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <!-- favicon Bing用 -->
  <link rel="icon" type="image/vnd.microsoft.icon" href="/favicon.ico">
  <link type="image/x-icon" href="/favicon.ico" rel="shortcut icon">
  <link rel="shortcut icon" href="https://hyakuninisshu.com/favicon.ico">
  <script>
    function init() {
      var map = L.map('mapcontainer', { zoomControl: false });
      var oguraPoint = [35.02348, 135.65913];
      map.setView(oguraPoint, 15);
      L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
        attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>地理院タイル</a>"
      }).addTo(map);
      //ポップアップする文字（HTML可、ここでは画像を表示）
      var sucontents = "<p style='font-size:1.5em; margin-bottom:0;'>小倉山</p><img src='../img/ogurayama.webp' width='300'>"
      //ポップアップオブジェクトを作成
      var popup1 = L.popup({ maxWidth: 550 }).setContent(sucontents);
      var popup2 = L.popup().setContent("桜区役所です");
      //マーカーにポップアップを紐付けする。同時にbindTooltipでツールチップも追加
      L.marker(oguraPoint, { draggable: true }).bindPopup(popup1).bindTooltip("小倉山").addTo(map);
      L.marker([35.8561, 139.6098]).bindPopup(popup2).bindTooltip(" ").addTo(map);
    }
  </script>
  <style>
    #mapcontainer{
      width:350px;
      height:350px;
    }
  </style>
</head>
<body onload="init()">
  <div id="mapcontainer" style="position:absolute;top:0;left:0;right:0;bottom:0;"></div>
</body>
</html>
