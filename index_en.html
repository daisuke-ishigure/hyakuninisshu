  <script>
/* ===== 歌番号ティッカーの自動生成（1セット分を2セット並べてシームレスにループ） ===== */
/* reverse=trueのときは100→1の逆順で並べる（右側ティッカー用） */
/* EN版：各番号は英語版の詩ページ（N_en.html）へリンクする */
function buildTicker(containerId, reverse) {
  const track = document.getElementById(containerId);
  if (!track) return;
  track.innerHTML = "";
  const nums = [];
  for (let i = 1; i <= 100; i++) nums.push(i);
  if (reverse) nums.reverse();
  for (let set = 0; set < 2; set++) {
    nums.forEach((i) => {
      const a = document.createElement('a');
      a.className = 'number-ticker-item';
      a.href = '/' + i + '_en.html';
      a.textContent = i;
      if (set === 1) a.setAttribute('aria-hidden', 'true');
      track.appendChild(a);
    });
  }
}

buildTicker("number-ticker-track");
buildTicker("number-ticker-track-right");

/* ===== 歌番号ティッカーのドラッグ操作＋自動スクロール ===== */
/* PC：横向き（translateX、右から左）／SP：縦向き（translateY、下から上）
   右側ティッカー（direction:1）は逆向き（translateY、上から下）に流す */
(function () {
  const mq = window.matchMedia('(max-width: 799px)');
  function isVertical() { return mq.matches; }
  const SPEED = 56;          // 自動スクロール速度（px/秒）
  const HOVER_PAUSE_MS = 5000; // 数字にホバーしたら止めておく時間
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // direction: -1＝左側ティッカー（0から負方向へ、上へ流れる）
  //             1＝右側ティッカー（-singleSetSizeから0へ、下へ流れる＝逆方向）
  function initTicker(wrap, track, direction) {
    if (!wrap || !track) return;

    let pos = 0;               // 現在のtranslateX/Y（px、-singleSetSize〜0の範囲）
    let singleSetSize = 0;     // 歌番号100個、1セット分のサイズ（横幅 or 縦幅）
    let isDragging = false;
    let dragStart = 0;
    let dragStartPos = 0;
    let dragMoved = 0;
    let pauseUntil = 0;

    function measure() {
      singleSetSize = isVertical() ? track.scrollHeight / 2 : track.scrollWidth / 2;
    }
    measure();
    pos = direction > 0 ? -singleSetSize : 0;
    window.addEventListener('resize', measure);

    // 向きが変わったら位置をリセットして測り直す
    function handleOrientationChange() {
      measure();
      pos = direction > 0 ? -singleSetSize : 0;
      apply();
    }
    if (mq.addEventListener) {
      mq.addEventListener('change', handleOrientationChange);
    } else if (mq.addListener) {
      mq.addListener(handleOrientationChange);
    }

    // 2セット分ループしているので、範囲外に出たら1セット分ワープさせてシームレスに見せる
    function wrapPos(val) {
      if (!singleSetSize) return val;
      while (val <= -singleSetSize) val += singleSetSize;
      while (val > 0) val -= singleSetSize;
      return val;
    }

    function apply() {
      track.style.transform = isVertical() ? `translateY(${pos}px)` : `translateX(${pos}px)`;
    }

    let lastTime = null;
    function tick(now) {
      if (lastTime === null) lastTime = now;
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      if (!isDragging && !reduceMotion && now >= pauseUntil) {
        pos = wrapPos(pos + direction * SPEED * dt);
        apply();
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    function coord(e) {
      return isVertical() ? e.clientY : e.clientX;
    }

    // 数字にホバーしている間（＋離れてから5秒間）は自動スクロールを止める
    wrap.addEventListener('mousemove', (e) => {
      if (e.target.closest('.number-ticker-item')) {
        pauseUntil = performance.now() + HOVER_PAUSE_MS;
      }
    });

    // ※ setPointerCaptureは使わない。捕捉するとクリックのtargetがwrap自身に
    //   すり替わり、<a>のリンク遷移が起きなくなってしまうため。
    //   代わりに、ドラッグ中だけwindowにmove/upを一時的に登録する。
    function pointerDown(e) {
      isDragging = true;
      dragMoved = 0;
      dragStart = coord(e);
      dragStartPos = pos;
      wrap.classList.add('dragging');
      window.addEventListener('pointermove', pointerMove);
      window.addEventListener('pointerup', pointerUp);
      window.addEventListener('pointercancel', pointerUp);
    }

    function pointerMove(e) {
      if (!isDragging) return;
      const d = coord(e) - dragStart;
      dragMoved = Math.max(dragMoved, Math.abs(d));
      pos = wrapPos(dragStartPos + d);
      apply();
    }

    function pointerUp() {
      if (!isDragging) return;
      isDragging = false;
      wrap.classList.remove('dragging');
      window.removeEventListener('pointermove', pointerMove);
      window.removeEventListener('pointerup', pointerUp);
      window.removeEventListener('pointercancel', pointerUp);
    }

    wrap.addEventListener('pointerdown', pointerDown);

    // ドラッグでリンクを動かした後は、離した瞬間のクリックでページ遷移しないようにする
    track.addEventListener('click', (e) => {
      if (dragMoved > 5) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);
  }

  initTicker(document.getElementById('number-ticker-left'), document.getElementById('number-ticker-track'), -1);
  initTicker(document.getElementById('number-ticker-right'), document.getElementById('number-ticker-track-right'), 1);
})();
</script>
