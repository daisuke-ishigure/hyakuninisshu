    <!-- ── Missed-cards flip card styles ──────────────────────────── -->
    <style>
      /* ── Section heading ── */
      #missed_cards_section {
        margin-top: 24px;
        text-align: left;
      }
      .missed-cards-heading {
        font-size: 14px;
        font-weight: bold;
        color: #B82343;
        margin-bottom: 10px;
        text-align: center;
      }

      /* ── Card grid ── */
      #missed_cards_list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        background: #f0ebe0;
        border-radius: 8px;
        padding: 10px;
      }

      /* ── One card (perspective container) ── */
      .missed-card-wrapper {
        width: clamp(90px, 30vw, 130px);
        height: clamp(115px, 38vw, 165px);
        perspective: 600px;
        cursor: pointer;
        flex-shrink: 0;
        /* wrapper itself is transparent for the flip effect */
        background: none !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        -webkit-tap-highlight-color: transparent;
      }

      /* ── Rotation axis (holds front + back) ── */
      .missed-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.45s ease;
      }
      .missed-card-wrapper.flipped .missed-card-inner {
        transform: rotateY(180deg);
      }

      /* ── Front and back shared styles ── */
      .missed-card-front,
      .missed-card-back {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        box-sizing: border-box;
        padding: 6px 5px;
        background: #fdf8e8;
        border: 2px solid #c8a84b;
        border-radius: 4px;
      }

      /* ── Front: torihuda (lower verse card face) — vertical ── */
      .missed-card-front {
        justify-content: center;
        align-items: center;
      }
      .missed-card-front p {
        margin: 0;
        writing-mode: vertical-rl;
        text-orientation: mixed;
        line-height: 1.6;
        max-height: 100%;
        max-width: 100%;
        box-sizing: border-box;
        font-family: 'Kaisei HarunoUmi', serif;
      }

      /* ── Back: full poem — vertical ── */
      .missed-card-back {
        transform: rotateY(180deg);
        background: #f0e8cc;
        border-color: #a07830;
        justify-content: center;
        align-items: center;
        color: #333;
      }
      .missed-card-back__uta {
        display: block;
        writing-mode: vertical-rl;
        text-orientation: mixed;
        white-space: pre-line;
        line-height: 1.6;
        max-height: 100%;
        font-family: 'Kaisei HarunoUmi', serif;
      }

      /* ── Number badge (both faces, bottom-left, horizontal) ── */
      .missed-card-number {
        position: absolute;
        bottom: 4px;
        left: 5px;
        font-size: 9px;
        color: #bbb;
        writing-mode: horizontal-tb;
        font-family: 'Noto Sans JP', sans-serif;
        line-height: 1;
        pointer-events: none;
      }

      /* ── Tap hint ── */
      .missed-card-hint {
        font-size: 11px;
        color: #999;
        text-align: center;
        margin-top: 6px;
      }

      /* ── Typewriter: pointer cursor on question card ── */
      .typewriter-card { cursor: pointer; position: relative; }

      /* ── Skip hint (bottom-right of card) ── */
      .skip-hint {
        position: absolute;
        bottom: 6px;
        right: 6px;
        font-size: 9px;
        color: #bbb;
        writing-mode: horizontal-tb;
        font-family: 'Noto Sans JP', sans-serif;
        pointer-events: none;
        transition: opacity 0.4s;
      }

      /* ── Choice buttons while animation is playing ── */
      .kimariji-card { transition: opacity 0.5s; }
      .kimariji-card.choices-waiting { opacity: 0.35 !important; cursor: default !important; }
    </style>
