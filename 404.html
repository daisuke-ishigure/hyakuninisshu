  <!-- GitHub Pages は存在しないURLにこのページを返す（ステータスは404）。
       どの階層のURLでも表示されるので、CSS・JS・画像・リンクはすべて / から始まる絶対パスで書くこと。 -->
  <!-- 旧サイトの歌ページ（/no17chihayaburu/ など）で、転送用ページを置いていないURL
       （29番・/feed/ 付きなど）は、下のスクリプトが歌番号を読み取って転送する。 -->
  <script>
    (function () {
      var m = location.pathname.match(/^\/no([0-9]{1,3})(?:[a-zA-Z0-9_-]*)(?:\/.*)?$/);
      if (m) {
        var n = parseInt(m[1], 10);
        if (n >= 1 && n <= 100) location.replace("/" + n + ".html" + location.search + location.hash);
      }
    })();
  </script>
