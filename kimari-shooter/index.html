<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8X7WDTSLFD"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-8X7WDTSLFD');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>決まり字シューター | 百人一首</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PixiJS の canvas はここに JS で挿入される -->

  <!-- 浮遊する札エリア（DOM） -->
  <div id="card-area"></div>

  <!-- プレイヤー（台座） -->
  <div id="player">
    <div id="player-guide"></div><!-- 真上ガイドライン -->
  </div>

  <!-- 3択ボタンと制限時間バー -->
  <div id="kimari-area">
    <div id="timer-bar-wrap">
      <div id="timer-bar"></div>
    </div>
    <!-- ボタンはJSで動的に生成 -->
    <div id="choices-wrap" class="hidden"></div>
  </div>

  <!-- スコア・コンボ表示 -->
  <div id="ui">
    <div id="score-display">スコア <span id="score">0</span></div>
    <div id="combo-display" class="hidden"><span id="combo">2</span> コンボ！</div>
  </div>

  <!-- スタート画面 -->
  <div id="start-screen">
    <div class="overlay-box">
      <h1 class="game-title">決まり字<br>シューター</h1>
      <p class="game-desc">
        台座を動かして<br>
        札の真下に潜り込め！<br>
        決まり字ボタンを押して<br>
        札を解放しよう。
      </p>
      <div class="how-to">
        <div><span>← →</span> 台座を動かす</div>
        <div><span>↑ ↓</span> 選択肢を選ぶ &nbsp;<span>Enter</span> 決定</div>
        <div>スマホ: <span>傾ける</span> で移動・<span>タップ</span> で選択</div>
      </div>
      <button id="start-btn" class="action-btn">はじめる</button>
    </div>
  </div>

  <!-- 各ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
