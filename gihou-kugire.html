        <h1>和歌の技法:<span style="display:inline-block;">句切れ</span></h1>
        <p>
          句切れとは、複数の文で構成されている歌における意味上の切れ目のことです。句切れの位置がわかると、和歌の意味を理解しやすくなります。
        </p>
        <p>句切れは、次の文法表現の位置にあります。</p>
        <ul class="normal">
          <li>終止形</li>
          <li>命令形</li>
          <li>終助詞</li>
          <li>係り結び</li>
          <li>呼びかけの間投助詞</li>
        </ul>
