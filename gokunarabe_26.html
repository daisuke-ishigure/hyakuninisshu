            <h2 class="imi">意味</h2>
            <p class="kaisetsu">
              小倉山のもみぢ葉よ。心あらばもう一度の<span class="tippy gyoukou"><ruby>行幸<rt>みゆき</rt></ruby></span>があるまで散らずに待っていてほしい。
            </p>
            <h2 class="kaisetsu">解説</h2>
            <p class="kaisetsu">
              この歌は、小倉山の紅葉に深く感動された宇多上皇が「この美しい景色を、ぜひ皇子の醍醐天皇にも見せたい」と仰った際に、随行していた作者が応えて詠んだ一首です。
            </p>
            <p class="kaisetsu">
              主君の思いを見事に歌へと昇華するところに、作者の優れた感性をうかがい知ることができます。
            </p>
            <a href="26.html" class="detail-btn">詳しくはこちら</a>
          </div>
