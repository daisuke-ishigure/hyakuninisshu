  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
  const linkMap = {
    "あきの":1,"はるす":2,"あし":3,"たご":4,"おく":5,"かさ":6,"あまの":7,"わがい":8,"はなの":9,"これ":10,
    "わたのはらや":11,"あまつ":12,"つく":13,"みち":14,"きみがためは":15,"たち":16,"ちは":17,"す":18,"なにはが":19,"わび":20,
    "いまこ":21,"ふ":22,"つき":23,"この":24,"なにし":25,"をぐ":26,"みかの":27,"やまざ":28,"こころあ":29,"ありあ":30,
    "あさぼらけあ":31,"やまが":32,"ひさ":33,"たれ":34,"ひとは":35,"なつ":36,"しら":37,"わすら":38,"あさぢ":39,"しの":40,
    "こひ":41,"ちぎりき":42,"あひ":43,"あふこ":44,"あはれ":45,"ゆら":46,"やへ":47,"かぜを":48,"みかき":49,"きみがためを":50,
    "かく":51,"あけ":52,"なげき":53,"わすれ":54,"たき":55,"あらざ":56,"め":57,"ありま":58,"やす":59,"おおえ":60,
    "いに":61,"よを":62,"いまは":63,"あさぼらけう":64,"うら":65,"もろ":66,"はるの":67,"こころに":68,"あらし":69,"さ":70,
    "ゆふ":71,"おと":72,"たか":73,"うか":74,"ちぎりお":75,"わたのはらこ":76,"せ":77,"あはぢ":78,"あきか":79,"ながか":80,
    "ほ":81,"おも":82,"よのなかよ":83,"ながら":84,"よも":85,"なげけ":86,"む":87,"なにはえ":88,"たま":89,"みせ":90,
    "きり":91,"わがそ":92,"よのなかは":93,"みよ":94,"おほけ":95,"はなさ":96,"こぬ":97,"かぜそ":98,"ひとも":99,"もも":100
  };

  function gyouColor(t) {
    const c = (t||'').charAt(0);
    if('あいうえお'.includes(c)) return '#e57373';
    if('かきくけこ'.includes(c)) return '#4caf50';
    if('さしすせそ'.includes(c)) return '#42a5f5';
    if('たちつてと'.includes(c)) return '#fdd835';
    if('なにぬねの'.includes(c)) return '#ff9800';
    if('はひふへほ'.includes(c)) return '#ab47bc';
    if('まみむめも'.includes(c)) return '#26a69a';
    if('やゆよ'.includes(c))     return '#ef6c00';
    if('わをん'.includes(c))     return '#5c6bc0';
    return '#90a4ae';
  }

  const depth1Colors = {
    'あ17枚':  '#e53935',
    'な8枚':   '#8e24aa',
    '三枚札':  '#1e88e5',
    '二枚札':  '#00897b',
    'その他グループ': '#f4511e',
  };

  // 決まり字のローマ字（js/kimariji.json の type_kimariji_gendai を流用。手打ち変換はしない）
  let numToRomaji = {};
  fetch('../js/kimariji.json?20261028-01').then(r => r.json()).then(list => {
    list.forEach(s => { if (s.id && s.type_kimariji_gendai) numToRomaji[s.id] = s.type_kimariji_gendai; });
    // 初回描画がこの fetch より先に終わっている場合に備えてラベルを描き直す
    g.selectAll('.label').text(labelOf);
  });

  const L = (n, label, ch) => ({ name: n, label: label || n, children: ch });
  const N = n => ({ name: n, num: linkMap[n], leaf: !!linkMap[n] });

  // 葉ノードのラベル：仮名 + ローマ字 + 番号
  function labelOf(d) {
    if (!d.data.leaf) return d.data.label;
    const romaji = numToRomaji[d.data.num];
    return romaji ? `${d.data.name} ${romaji} (${d.data.num})` : `${d.data.name} (${d.data.num})`;
  }

  const treeData = L('root', 'Tomofuda', [
    L('あ17枚', 'A: 17 cards', [
      L('あき2', 'あき aki: 2 cards', ['あきの','あきか'].map(N)),
      L('あさ3', 'あさ asa: 3 cards', ['あさぢ','あさぼらけあ','あさぼらけう'].map(N)),
      L('あま2', 'あま ama: 2 cards', ['あまの','あまつ'].map(N)),
      L('あり2', 'あり ari: 2 cards', ['ありあ','ありま'].map(N)),
      L('あら2', 'あら ara: 2 cards', ['あらざ','あらし'].map(N)),
      L('その他6', 'Other A cards: 6', ['あし','あひ','あふこ','あはれ','あけ','あはぢ'].map(N)),
    ]),
    L('な8枚', 'Na: 8 cards', [
      L('なに3', 'なに nani: 3 cards', ['なにはが','なにはえ','なにし'].map(N)),
      L('なが2', 'なが naga: 2 cards', ['ながか','ながら'].map(N)),
      L('なげ2', 'なげ nage: 2 cards', ['なげき','なげけ'].map(N)),
      N('なつ'),
    ]),
    L('三枚札', 'Three-card groups', [
      L('い3', 'い i: 3 cards', ['いまこ','いまは','いに'].map(N)),
      L('き3', 'き ki: 3 cards', ['きみがためは','きみがためを','きり'].map(N)),
      L('ち3', 'ち chi: 3 cards', ['ちは','ちぎりき','ちぎりお'].map(N)),
      L('ひ3', 'ひ hi: 3 cards', ['ひさ','ひとは','ひとも'].map(N)),
    ]),
    L('二枚札', 'Two-card groups', [
      L('う2', 'う u: 2 cards', ['うら','うか'].map(N)),
      L('つ2', 'つ tsu: 2 cards', ['つく','つき'].map(N)),
      L('し2', 'し shi: 2 cards', ['しら','しの'].map(N)),
      L('ゆ2', 'ゆ yu: 2 cards', ['ゆら','ゆふ'].map(N)),
      L('も2', 'も mo: 2 cards', ['もろ','もも'].map(N)),
    ]),
    L('その他グループ', 'Other groups', [
      L('お5', 'お o: 5 cards', ['おく','おおえ','おと','おも','おほけ'].map(N)),
      L('か4', 'か ka: 4 cards', ['かさ','かく','かぜを','かぜそ'].map(N)),
      L('こ6', 'こ ko: 6 cards', ['これ','この','こころあ','こころに','こひ','こぬ'].map(N)),
      L('た6', 'た ta: 6 cards', ['たご','たち','たれ','たき','たか','たま'].map(N)),
      L('は4', 'は ha: 4 cards', ['はるす','はるの','はなの','はなさ'].map(N)),
      L('み5', 'み mi: 5 cards', ['みち','みかの','みかき','みせ','みよ'].map(N)),
      L('や4', 'や ya: 4 cards', ['やまざ','やまが','やへ','やす'].map(N)),
      L('よ4', 'よ yo: 4 cards', ['よを','よも','よのなかよ','よのなかは'].map(N)),
      L('わ7', 'わ wa: 7 cards', ['わたのはらや','わたのはらこ','わがい','わがそ','わび','わすら','わすれ'].map(N)),
    ]),

  ]);

  // ── 描画 ────────────────────────────────────
  const el   = document.getElementById('svg-container');
  const main = document.querySelector('main');
  const svg  = d3.select('#svg-container').append('svg')
    .attr('width',  main.clientWidth)
    .attr('height', main.clientHeight);
  const g = svg.append('g');

  const zoom = d3.zoom().scaleExtent([0.05, 6])
    .on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);

  const tree = d3.tree().nodeSize([20, 200]);
  let root = d3.hierarchy(treeData);

  function collapseAll(d) {
    if (d.children) {
      d._children = d.children;
      d.children = null;
      d._children.forEach(collapseAll);
    }
  }
  collapseAll(root);

  let uid = 0;

  function nodeColor(d) {
    if (d.depth === 0) return '#b82343';
    if (d.data.leaf) return gyouColor(d.data.name);
    if (d.depth === 1) return depth1Colors[d.data.name] || '#8a9a78';
    if (d.depth === 2 && d.parent) return depth1Colors[d.parent.data.name] || '#8a9a78';
    return '#8a9a78';
  }

  function update(src, duration) {
    const dur = duration !== undefined ? duration : 200;
    tree(root);
    const nodes = root.descendants();
    const links = root.links();

    const lSel = g.selectAll('path.link').data(links, d => d.target.id);
    lSel.enter().insert('path', 'g')
      .attr('class', 'link')
      .attr('d', () => { const o = [src.y0??src.y, src.x0??src.x]; return d3.linkHorizontal()({source:o, target:o}); })
      .merge(lSel).transition().duration(dur)
      .attr('d', d => d3.linkHorizontal()({source:[d.source.y, d.source.x], target:[d.target.y, d.target.x]}));
    lSel.exit().transition().duration(dur)
      .attr('d', () => { const o = [src.y, src.x]; return d3.linkHorizontal()({source:o, target:o}); }).remove();

    const nSel = g.selectAll('g.node').data(nodes, d => d.id || (d.id = ++uid));
    const nEnter = nSel.enter().append('g').attr('class', 'node')
      .attr('transform', () => `translate(${src.y0??src.y},${src.x0??src.x})`)
      .style('opacity', 0)
      .on('click', (ev, d) => {
        if (d.data.leaf) { window.open(`${d.data.num}_en.html`, '_blank'); return; }
        if (d.children) { d._children = d.children; d.children = null; }
        else { d.children = d._children; d._children = null; }
        update(d);
      });

    nEnter.append('circle')
      .attr('r', d => d.depth === 0 ? 14 : d.data.leaf ? 7 : 10)
      .attr('fill', nodeColor)
      .attr('stroke', d => d.depth === 0 ? '#7a1030' : d.data.leaf ? '#666' : '#4a4a4a')
      .style('cursor', d => d.data.leaf ? 'pointer' : 'default');

    nEnter.filter(d => !d.data.leaf).append('text')
      .attr('class', 'toggle-icon')
      .attr('text-anchor', 'middle').attr('dy', '0.35em')
      .attr('font-size', '10px').attr('fill', '#fff').attr('pointer-events', 'none');

    nEnter.append('text')
      .attr('class', 'label')
      .attr('dy', '0.35em')
      .attr('x', d => d.data.leaf ? 11 : (d.depth === 0 ? 18 : 13))
      .attr('font-size', d => d.depth === 0 ? '14px' : d.data.leaf ? '11px' : '12px')
      .attr('font-weight', d => d.depth <= 1 ? 'bold' : 'normal')
      .style('cursor', d => d.data.leaf ? 'pointer' : 'default');

    const nMerge = nEnter.merge(nSel);
    nMerge.transition().duration(dur)
      .attr('transform', d => `translate(${d.y},${d.x})`).style('opacity', 1);

    nMerge.select('.toggle-icon')
      .text(d => d.children ? '−' : (d._children ? '＋' : ''));

    nMerge.select('.label')
      .text(labelOf);

    nSel.exit().transition().duration(dur)
      .attr('transform', `translate(${src.y},${src.x})`).style('opacity', 0).remove();

    nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
  }

  // ── カスケードアニメーション ──────────────────
  const STEP_DURATION = 450;
  const STEP_DELAY    = 900;
  const FIT_DURATION  = 500;

  function animateCascade() {
    const maxDepth = 3;
    function openDepth(targetDepth) {
      let opened = false;
      root.each(d => {
        if (d.depth === targetDepth && d._children) {
          d.children = d._children;
          d._children = null;
          opened = true;
        }
      });
      if (opened) {
        update(root, STEP_DURATION);
        setTimeout(() => fitView(FIT_DURATION), STEP_DURATION + 30);
      }
    }
    for (let d = 0; d <= maxDepth; d++) {
      setTimeout(() => openDepth(d), d * STEP_DELAY);
    }
  }

  update(root, 0);
  setTimeout(() => {
    fitView(400);
    setTimeout(() => {
      animateCascade();
      // カスケード完了後、depth>=2（サブグループ・リーフ）を閉じ、
      // depth=1（あ17枚〜その他グループの5グループ）のみ展開した状態に戻す
      const cascadeDuration = (3 * STEP_DELAY) + STEP_DURATION + FIT_DURATION + 300;
      setTimeout(() => {
        root.each(d => {
          if (d.depth >= 2 && d.children) {
            d._children = d.children;
            d.children = null;
          }
        });
        update(root, 500);
        setTimeout(() => fitView(500), 560);
      }, cascadeDuration);
    }, 400);
  }, 50);

  function fitView(duration) {
    const dur = duration !== undefined ? duration : 400;
    const b = g.node().getBBox();
    if (!b.width || !b.height) return;
    const W = main.clientWidth  || window.innerWidth;
    const H = main.clientHeight || (window.innerHeight - 120);
    const padX = 140, padY = 20;
    const sc  = Math.min((W - padX) / b.width, (H - padY) / b.height);
    const tx  = W / 2 - sc * (b.x + b.width  / 2);
    const ty  = H / 2 - sc * (b.y + b.height / 2);
    svg.transition().duration(dur).call(
      zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(sc)
    );
  }

  // ── フィルター機能 ────────────────────────────
  function focusGroup(groupIndex) {
    // 全ノードを完全に閉じる
    root.each(d => {
      const c = d.children || d._children;
      if (c) { d._children = c; d.children = null; }
    });

    if (groupIndex === 'all') {
      root.each(d => {
        if (d._children) { d.children = d._children; d._children = null; }
      });
      update(root, 300);
      setTimeout(() => fitView(400), 350);
      return;
    }

    // root を開く
    if (root._children) { root.children = root._children; root._children = null; }

    // 対象以外の depth=1 ノードを閉じたまま
    root.children.forEach((child) => {
      const c = child.children || child._children;
      if (c) { child._children = c; child.children = null; }
    });

    // 対象グループだけ全展開
    const target = root.children[groupIndex];
    function openAll(d) {
      if (d._children) { d.children = d._children; d._children = null; }
      if (d.children) d.children.forEach(openAll);
    }
    openAll(target);

    update(root, 300);

    // BBox で実描画領域を取得してフォーカス
    setTimeout(() => {
      const b = g.node().getBBox();
      if (!b.width || !b.height) return;
      const W = main.clientWidth;
      const H = main.clientHeight;
      const padX = 20, padY = 40;
      const scX = (W - padX) / b.width;
      const scY = (H - padY) / b.height;
      const sc  = Math.min(scX, scY, 5.0);
      const tx  = W / 2 - sc * (b.x + b.width  / 2);
      const ty  = H / 2 - sc * (b.y + b.height / 2);
      svg.transition().duration(400).call(
        zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(sc)
      );
    }, 450);
  }

  // フィルターボタンのイベント登録
  document.querySelectorAll('.filter-bar button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-bar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const f = btn.dataset.filter;
      focusGroup(f === 'all' ? 'all' : parseInt(f));
    });
  });

  window.addEventListener('resize', () => {
    svg.attr('width', main.clientWidth).attr('height', main.clientHeight); fitView();
  });
  </script>
</body>
</html>
