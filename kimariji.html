  <!-- ── 間違えた札フリップカード スタイル ───────────────────────── -->
  <style>
    /* ── セクション見出し ── */
    #missed_cards_section {
      margin-top: 24px;
      text-align: left;
    }

    .missed-cards-heading {
      font-size: 14px;
      font-weight: bold;
      color: #B82343;
      margin-bottom: 10px;
      text-align: center;
    }

    /* ── カードグリッド ── */
    #missed_cards_list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      background: #f0ebe0;
      border-radius: 8px;
      padding: 10px;
    }

    /* ── 1枚のカード（perspective コンテナ） ── */
    .missed-card-wrapper {
      width: clamp(90px, 30vw, 130px);
      height: clamp(115px, 38vw, 165px);
      perspective: 600px;
      cursor: pointer;
      flex-shrink: 0;
      /* フリップ演出のためラッパー自体は透明 */
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── 回転軸（表裏を束ねる） ── */
    .missed-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.45s ease;
    }

    .missed-card-wrapper.flipped .missed-card-inner {
      transform: rotateY(180deg);
    }

    /* ── 表・裏 共通スタイル ── */
    .missed-card-front,
    .missed-card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      box-sizing: border-box;
      padding: 6px 5px;
      background: #fdf8e8;
      border: 2px solid #c8a84b;
      border-radius: 4px;
    }

    /* ── 表面：取り札（下の句）縦書き ── */
    .missed-card-front {
      justify-content: center;
      align-items: center;
    }

    .missed-card-front p {
      margin: 0;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      line-height: 1.6;
      max-height: 100%;
      max-width: 100%;
      box-sizing: border-box;
      font-family: 'Noto Serif JP', serif;
    }

    /* ── 裏面：和歌全体 縦書き ── */
    .missed-card-back {
      transform: rotateY(180deg);
      background: #f0e8cc;
      border-color: #a07830;
      justify-content: center;
      align-items: center;
      color: #333;
    }

    .missed-card-back__uta {
      display: block;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      white-space: pre-line;
      line-height: 1.6;
      max-height: 100%;
      font-family: 'Noto Serif JP', serif;
    }

    /* ── 番号（表裏共通・左下に横書きで表示） ── */
    .missed-card-number {
      position: absolute;
      bottom: 4px;
      left: 5px;
      font-size: 9px;
      color: #bbb;
      writing-mode: horizontal-tb;
      font-family: 'Noto Sans JP', sans-serif;
      line-height: 1;
      pointer-events: none;
    }

    /* ── タップヒント ── */
    .missed-card-hint {
      font-size: 11px;
      color: #999;
      text-align: center;
      margin-top: 6px;
    }

    /* ── タイプライター：問題カードにカーソルを付ける ── */
    .typewriter-card {
      cursor: pointer;
      position: relative;
    }

    /* ── スキップヒント（カード内右下） ── */
    .skip-hint {
      position: absolute;
      bottom: 2px;
      right: 2px;
      font-size: 9px;
      color: #555;
      writing-mode: horizontal-tb;
      font-family: 'Noto Sans JP', sans-serif;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    /* ── アニメーション待機中の選択肢ボタン ── */
    .kimariji-card {
      transition: opacity 0.5s;
    }

    .kimariji-card.choices-waiting {
      opacity: 0.35 !important;
      cursor: default !important;
    }

    /* 称号アコーディオン */
    .title-accordion { margin:12px 0; border:1px solid #e0d8c8; border-radius:8px; overflow:hidden; background:#fff; }
    .title-accordion summary { padding:10px 16px; cursor:pointer; font-size:13px; font-weight:bold; color:#B82343; background:#fff9f0; list-style:none; display:flex; align-items:center; gap:6px; user-select:none; }
    .title-accordion summary::-webkit-details-marker { display:none; }
    .title-accordion summary::after { content:'▼'; margin-left:auto; font-size:10px; color:#aaa; transition:transform 0.2s; }
    .title-accordion[open] summary::after { transform:rotate(180deg); }
    .title-table { width:100%; border-collapse:collapse; font-size:13px; }
    .title-table th { background:#f7f1e0; padding:6px 12px; text-align:left; color:#666; font-weight:bold; border-bottom:1px solid #e0d8c8; }
    .title-table td { padding:6px 12px; border-bottom:1px solid #f0ebe0; color:#444; }
    .title-table tr:last-child td { border-bottom:none; }
    .title-table tr:nth-child(even) td { background:#fdf9f2; }
    .title-note { font-size:0.8rem !important; color:#333; padding:8px 16px; margin:0 !important; background:#fafafa; border-top:1px solid #f0ebe0; }
    .kimariji-card p, .question-card, .question-card p, #message-container {
      font-family: "Noto Serif JP", serif;
    }
  </style>
