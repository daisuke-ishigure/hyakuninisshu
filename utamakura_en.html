    .leaflet-top.leaflet-left .map-legend {
      position: absolute;
      top: 0;

      align-items: center;

    /* ===== スマホ用フッターナビ（js/back-to-top.js が生成） =====

    .sp-appbar {

      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      opacity: 0;

      transition: opacity 0.15s;

      .sp-appbar__item:active {
        opacity: 0.6;
        background: rgba(255, 255, 255, 0.14);
      }

      .sp-appbar__icon {
        width: 26px;
        height: 26px;
        object-fit: contain;
        display: block;

        overflow: hidden;
        text-overflow: ellipsis;
